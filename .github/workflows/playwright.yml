name: Playwright

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

env:
  PLAYWRIGHT_VERSION: 1.65.0

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    needs: typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Run tests (shard ${{ matrix.shard }}/2)
        env:
          HOME: /root
        run: >
          npx playwright test
          --project=api
          --project=chromium
          --project=firefox
          --project=webkit
          --project=visual
          --shard=${{ matrix.shard }}/2
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  accessibility:
    name: Accessibility audit (advisory)
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Run accessibility scans
        env:
          HOME: /root
        run: >
          npx playwright test
          --project=a11y
          --retries=0
          --reporter=html,list
      - name: Upload accessibility results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Explain advisory status
        if: ${{ !cancelled() }}
        run: |
          echo "### Accessibility audit — advisory" >> "$GITHUB_STEP_SUMMARY"
          echo "This audit targets a public demo application." >> "$GITHUB_STEP_SUMMARY"
          echo "Serious and critical findings fail the accessibility tests but do not block this workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "Review the scan outcome and accessibility-report artifact. A green workflow does not mean accessibility passed." >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

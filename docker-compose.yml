# Run the suite in the same container image CI uses, so local and CI results match.
#   docker compose run --rm tests              full suite (all browsers)
#   docker compose run --rm visual             visual comparison
#   docker compose run --rm visual-update      explicitly update visual baselines
x-common: &common
  build: .
  platform: linux/amd64
  ipc: host            # Chromium needs more shared memory than Docker's default
  environment:
    UI_BASE_URL: ${UI_BASE_URL:-https://automationexercise.com}
    API_BASE_URL: ${API_BASE_URL:-https://automationexercise.com/api/}
    CI: ${CI:-false}
    JENKINS: ${JENKINS:-false}
  volumes:
    - ./playwright-report:/app/playwright-report
    - ./test-results:/app/test-results
    - ./blob-report:/app/blob-report
    - ./tests/__screenshots__:/app/tests/__screenshots__

services:
  tests:
    <<: *common

  visual:
    <<: *common
    command: npm run test:visual

  visual-update:
    <<: *common
    command: npm run test:visual:update
